name: Engineering checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code, database, and browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_PRODUCTION_BUILD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.106.0
      - run: npm ci
      - run: npm run check
      - run: node scripts/audit-dependencies.mjs
      - name: Use Ubuntu main archive for browser dependencies
        run: |
          for apt_source_file in /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list /etc/apt/apt-mirrors.txt /etc/apt/apt-security-mirrors.txt; do
            [ -f "$apt_source_file" ] || continue
            sudo sed -i -E 's#https?://[[:alnum:].-]+\.ec2\.archive\.ubuntu\.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$apt_source_file"
          done
      - run: npx playwright install --with-deps chromium
      - run: npm run test:services
      - run: npm run measure:build
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-and-theme-checks
          path: |
            /tmp/vrena-e2e-results
            /tmp/vrena-e2e-report
            /tmp/vrena-theme-audit
          retention-days: 7
      - name: Stop isolated services
        if: always()
        run: supabase stop --workdir e2e
